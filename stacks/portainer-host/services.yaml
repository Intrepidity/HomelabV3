services:
  portainer:
    image: portainer/portainer-ee:2.33.7
    container_name: portainer
    ports:
      - "9000:9000"
      - "8000:8000"
    environment:
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    restart: unless-stopped

volumes:
  portainer_data: